{% extends 'base.html' %}{% block title %}Set new PIN{% endblock %}{% block content %}<section class="form-page"><div class="form-copy"><p class="eyebrow">PIN RECOVERY</p><h1>Set a new file PIN.</h1><p>Enter the six-digit code from your email, then choose a new 4-digit PIN.</p></div><form class="form-card" method="post" autocomplete="off"><p><strong>{{ file.original_filename }}</strong></p><label for="code">Email verification code<input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" required autofocus></label><label for="new_pin">New 4-digit PIN<input id="new_pin" name="new_pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" minlength="4" required></label><button class="button primary" type="submit">Change PIN</button></form></section>{% endblock %}
