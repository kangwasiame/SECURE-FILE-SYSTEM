{% extends 'base.html' %}{% block title %}Verify download{% endblock %}{% block content %}<section class="form-page"><div class="form-copy"><p class="eyebrow">DOWNLOAD PROTECTION</p><h1>Enter the file PIN.</h1><p>Enter the 4-digit PIN created when this file was uploaded.</p></div><form class="form-card" method="post" autocomplete="off"><p><strong>{{ file.original_filename }}</strong></p><label for="pin">4-digit PIN<input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" minlength="4" required autofocus></label><button class="button primary" type="submit">Verify and download</button><a class="form-foot" href="{{ url_for('main.recover_pin', file_id=file.id) }}">Forgot your PIN? Verify by email</a><a class="form-foot" href="{{ url_for('main.dashboard') }}">Cancel</a></form></section>{% endblock %}
