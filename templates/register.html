{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<section class="form-page"><div class="form-copy"><p class="eyebrow">A PRIVATE START</p><h1>Make room for what matters.</h1><p>Create an account to keep your files in one controlled place.</p></div><form class="form-card" method="post"><label>Username<input name="username" required autocomplete="username"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirm password<input name="confirm_password" type="password" minlength="8" required autocomplete="new-password"></label><button class="button primary" type="submit">Create account</button><p class="form-foot">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p></form></section>{% endblock %}
